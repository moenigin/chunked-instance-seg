[project]
name = "chunked-instance-seg"
version = "0.1.0"
description = "Chunk-parallel, resumable instance segmentation and postprocessing for large Zarr-backed semantic segmentation volumes."
channels = ["conda-forge"]
# Adjust to match your actual dev + cluster targets -- linux-64 is the
# SLURM cluster; osx-arm64 only needed if you also develop on a Mac.
platforms = ["linux-64", "osx-arm64"]

[tasks]
segment = "python instance_segmentation_pipeline.py --config config.yaml"
postprocess = "python postprocess_instances.py --config postprocess_config.yaml"
test = "pytest -q"

[dependencies]
python = ">=3.10,<3.13"
numpy = ">=1.24"
pandas = ">=2.0"
pyarrow = ">=14"
scipy = ">=1.10"
scikit-image = ">=0.21"
joblib = ">=1.3"
tqdm = ">=4.65"
zarr = ">=2.18.7,<3"
pyyaml = ">=6.0"
ome-zarr = ">=0.11.1,<0.12"
matplotlib = ">=3.11.2,<4"

[feature.dev.dependencies]
pytest = ">=7.4"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
