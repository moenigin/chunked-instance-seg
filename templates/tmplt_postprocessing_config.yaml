# ==========================================
# POST-PROCESSING CONFIG
# ==========================================

# Inheritance
pipeline_config: "/path/to/my_project/pipeline_config.yaml"

# Overrides (Optional)
# output_metadata_path: "filtered_meta.parquet" # Defaults to overwriting the pipeline's metadata_path
# n_jobs: 8                                    # Overrides the n_jobs defined in pipeline_config

# Actions
steps:
  # TargetedStep: Removes objects outside this voxel range directly from metadata and volume
  - type: "size_filter"
    min_nvoxels: 1000
    # max_nvoxels: 50000

  # RescanStep: Expands labels. Writes a NEW volume and triggers a full metadata rescan afterward.
  - type: "expand_labels"
    distance: 2
    dest_path: "/path/to/my_project/expanded_instances.zarr"
    # halo: 3                                  # Optional: Padding for chunk-boundary overlap